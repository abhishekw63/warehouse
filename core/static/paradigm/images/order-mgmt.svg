<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" preserveAspectRatio="xMidYMid slice" font-family="'DM Sans',system-ui,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#283593"/>
      <stop offset="0.55" stop-color="#1A237E"/>
      <stop offset="1" stop-color="#0e1233"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5c6bc0"/>
      <stop offset="1" stop-color="#aeb6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#3949ab" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3949ab" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1000" height="1200" fill="url(#bg)"/>
  <rect width="1000" height="1200" fill="url(#dots)"/>
  <rect width="1000" height="1200" fill="url(#glow)"/>

  <!-- marketplace chips converging into the hub -->
  <g stroke="#aeb6ff" stroke-width="2" opacity="0.5" fill="none">
    <path d="M170 250 C 300 320, 380 360, 500 430"/>
    <path d="M500 215 C 500 320, 500 360, 500 430"/>
    <path d="M840 250 C 700 320, 620 360, 500 430"/>
    <path d="M150 360 C 300 400, 380 410, 500 450"/>
    <path d="M860 360 C 700 400, 620 410, 500 450"/>
  </g>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <g>
      <rect x="92" y="222" width="150" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
      <text x="167" y="255" fill="#eef0ff">Blinkit</text>
    </g>
    <g>
      <rect x="418" y="187" width="164" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
      <text x="500" y="220" fill="#eef0ff">Flipkart</text>
    </g>
    <g>
      <rect x="762" y="222" width="150" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
      <text x="837" y="255" fill="#eef0ff">Swiggy</text>
    </g>
    <g>
      <rect x="74" y="332" width="150" height="52" rx="26" fill="#ffffff" opacity="0.10"/>
      <text x="149" y="365" fill="#dfe2ff">Reliance</text>
    </g>
    <g>
      <rect x="786" y="332" width="150" height="52" rx="26" fill="#ffffff" opacity="0.10"/>
      <text x="861" y="365" fill="#dfe2ff">Myntra</text>
    </g>
  </g>

  <!-- dashboard card (the hub) -->
  <g>
    <rect x="150" y="430" width="700" height="430" rx="22" fill="#ffffff" opacity="0.96"/>
    <rect x="150" y="430" width="700" height="64" rx="22" fill="#1A237E"/>
    <rect x="150" y="470" width="700" height="24" fill="#1A237E"/>
    <circle cx="184" cy="462" r="7" fill="#ff6b6b"/>
    <circle cx="208" cy="462" r="7" fill="#ffd166"/>
    <circle cx="232" cy="462" r="7" fill="#51cf66"/>
    <text x="500" y="469" text-anchor="middle" font-size="22" font-weight="700" fill="#eef0ff" letter-spacing="3">ORDER MANAGEMENT</text>

    <!-- KPI row -->
    <g font-family="inherit">
      <rect x="180" y="520" width="195" height="92" rx="12" fill="#eef0fb"/>
      <text x="200" y="566" font-size="34" font-weight="800" fill="#1A237E">₹8.1Cr</text>
      <text x="200" y="592" font-size="15" fill="#6b6b80">Order value</text>

      <rect x="402" y="520" width="195" height="92" rx="12" fill="#eef0fb"/>
      <text x="422" y="566" font-size="34" font-weight="800" fill="#1A237E">565</text>
      <text x="422" y="592" font-size="15" fill="#6b6b80">POs recorded</text>

      <rect x="625" y="520" width="195" height="92" rx="12" fill="#eef0fb"/>
      <text x="645" y="566" font-size="34" font-weight="800" fill="#1A237E">12</text>
      <text x="645" y="592" font-size="15" fill="#6b6b80">Marketplaces</text>
    </g>

    <!-- bar chart -->
    <g>
      <line x1="180" y1="810" x2="820" y2="810" stroke="#e3e3ee" stroke-width="2"/>
      <rect x="210" y="730" width="64" height="80" rx="6" fill="url(#bar)"/>
      <rect x="312" y="688" width="64" height="122" rx="6" fill="url(#bar)"/>
      <rect x="414" y="712" width="64" height="98" rx="6" fill="url(#bar)"/>
      <rect x="516" y="660" width="64" height="150" rx="6" fill="url(#bar)"/>
      <rect x="618" y="700" width="64" height="110" rx="6" fill="url(#bar)"/>
      <rect x="720" y="672" width="64" height="138" rx="6" fill="url(#bar)"/>
      <polyline points="242,712 344,668 446,692 548,640 650,680 752,652"
                fill="none" stroke="#1A237E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#1A237E"><circle cx="242" cy="712" r="6"/><circle cx="344" cy="668" r="6"/><circle cx="446" cy="692" r="6"/><circle cx="548" cy="640" r="6"/><circle cx="650" cy="680" r="6"/><circle cx="752" cy="652" r="6"/></g>
    </g>
  </g>

  <!-- flow: hub -> D365 -->
  <g>
    <path d="M500 860 L 500 928" stroke="#aeb6ff" stroke-width="4" fill="none" marker-end="url(#a)"/>
    <defs><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M1 1 L 11 6 L 1 11 Z" fill="#aeb6ff"/></marker></defs>
    <rect x="392" y="936" width="216" height="70" rx="14" fill="#aeb6ff"/>
    <text x="500" y="980" text-anchor="middle" font-size="30" font-weight="800" fill="#12163a">D365 · SO</text>
  </g>

  <!-- parcels -->
  <g>
    <g transform="translate(150 1040)">
      <rect x="0" y="0" width="150" height="120" rx="10" fill="#d7b489"/>
      <rect x="0" y="0" width="150" height="120" rx="10" fill="#ffffff" opacity="0.06"/>
      <rect x="62" y="0" width="26" height="120" fill="#c79a6a"/>
      <rect x="0" y="48" width="150" height="22" fill="#caa377" opacity="0.8"/>
    </g>
    <g transform="translate(312 1072)">
      <rect x="0" y="0" width="120" height="88" rx="9" fill="#e0c39a"/>
      <rect x="50" y="0" width="20" height="88" fill="#cda674"/>
    </g>
    <!-- check badge -->
    <g transform="translate(700 1050)">
      <circle cx="55" cy="55" r="55" fill="#1b7a3d"/>
      <path d="M30 56 L 48 74 L 82 36" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- floating PO -> SO tags -->
  <g font-size="20" font-weight="700">
    <g transform="translate(560 1066)">
      <rect width="118" height="46" rx="23" fill="#ffffff" opacity="0.14"/>
      <text x="59" y="30" text-anchor="middle" fill="#eef0ff">PO ✓</text>
    </g>
  </g>
</svg>
