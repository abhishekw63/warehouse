# Render Blueprint - one-click deploy of the RENEE B2B web app.
# Business data lives in TiDB Cloud Serverless (set DB_* as secrets below).
# See HOSTING-CLOUD.md for the full walkthrough.
services:
  - type: web
    name: renee-b2b
    runtime: python
    plan: free
    # ⚡ PERF: co-locate the web service with TiDB Cloud, which is in Singapore
    # (ap-southeast-1). If Render is in the US (Oregon default) every DB round-trip
    # crosses the Pacific (~200ms); in Singapore it's ~10ms — the single biggest
    # page-speed win. Render pins region at CREATE time, so an EXISTING US service
    # must be RECREATED in Singapore (see PERF-REGION-MIGRATION.md). New blueprint
    # deploys pick this up directly.
    region: singapore
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    # --threads gives each worker I/O concurrency (the app waits on remote TiDB a
    # lot); --timeout 300 so a large Lock&Record (workbook build for thousands of
    # lines, ~85s+) is never killed mid-record by the old 120s cap.
    startCommand: "gunicorn renee_cosmetics.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 300"
    # ── PERSISTENT MEDIA (uploads + generated workbooks survive deploys) ──────
    # Render's disk is EPHEMERAL on the free plan — a redeploy/idle-spin-down drops
    # in-flight uploads/reviews and generated workbooks. To keep them, upgrade the
    # plan (disks need Starter+) and UNCOMMENT the block below + the MEDIA_ROOT
    # env var further down. Then all media (b2b_uploads, workbooks, record-check,
    # run sidecars) lands on the mounted disk instead of the ephemeral one.
    # disk:
    #   name: renee-media
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      # Uncomment together with the `disk:` block above (needs a paid plan) to put
      # uploads + generated workbooks on the persistent disk instead of ephemeral.
      # - key: MEDIA_ROOT
      #   value: "/data/media"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "warehouse-gi1r.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://warehouse-gi1r.onrender.com"
      - key: DJANGO_SECURE_SSL
        value: "1"
      # Put Django's auth/sessions in TiDB too (Render's disk is ephemeral, so
      # sqlite would wipe logins on every deploy/restart).
      - key: DJANGO_DEFAULT_DB
        value: "mysql"
      # TiDB (business DB) - set these as secrets in the Render dashboard.
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_SSL
        value: "1"
      # Email (Gmail SMTP) - set as secrets.
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
